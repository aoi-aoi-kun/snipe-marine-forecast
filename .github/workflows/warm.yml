# Keep the free-tier Render service awake and feed learning.
# Runs even when cron-job.org is capped at a 30s timeout.
name: warm-render

on:
  schedule:
    # Every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health?warm=1
        env:
          WARM_URL: https://shichirigahama-forecast.onrender.com/api/health?warm=1
        run: |
          set -euo pipefail
          # Cold start on Render free can exceed 30s; allow up to 2 minutes.
          for attempt in 1 2 3; do
            echo "attempt ${attempt}"
            if curl -fsS --max-time 120 -A "github-actions-warm" "$WARM_URL" -o /tmp/warm.json; then
              head -c 400 /tmp/warm.json; echo
              exit 0
            fi
            sleep 15
          done
          echo "warm failed after retries" >&2
          exit 1
