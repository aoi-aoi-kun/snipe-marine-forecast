services:
  web:
    build: .
    ports:
      - "3847:3847"
    environment:
      PORT: "3847"
      HOSTNAME: "0.0.0.0"
      # Leave unset to keep ~15-minute continuous MOS / pattern learning.
      # DISABLE_CONTINUOUS_LEARN: "1"
    volumes:
      - forecast-cache:/app/.cache
    restart: unless-stopped

volumes:
  forecast-cache:
