services:
  web:
    build: .
    ports:
      - "3847:3847"
    environment:
      PORT: "3847"
      HOSTNAME: "0.0.0.0"
      KEEP_ALIVE_URL: "http://127.0.0.1:3847"
      KEEP_ALIVE_MINUTES: "8"
      # Leave unset to keep continuous MOS / pattern learning.
      # DISABLE_CONTINUOUS_LEARN: "1"
    volumes:
      - forecast-cache:/app/.cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3847/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2m
      timeout: 20s
      retries: 3
      start_period: 2m

volumes:
  forecast-cache:
