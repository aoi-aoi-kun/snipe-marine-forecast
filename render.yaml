# Learning durability:
# - Image bakes data/learning-seed (restored on boot if .cache is empty).
# - Prefer a persistent Disk at /app/.cache so live learning survives redeploys.
# Free plan cannot attach Disk; upgrade and uncomment the disk block below.
services:
  - type: web
    name: shichirigahama-forecast
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "3847"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: KEEP_ALIVE_MINUTES
        value: "8"
      - key: ECMWF_CONCURRENCY
        value: "2"
      - key: CACHE_DIR
        value: "/app/.cache"
      - key: LEARNING_SEED_DIR
        value: "/app/data/learning-seed"
      # RENDER_EXTERNAL_URL is set by Render and enables in-process keep-alive pings.
    # disk:
    #   name: forecast-learning
    #   mountPath: /app/.cache
    #   sizeGB: 1
