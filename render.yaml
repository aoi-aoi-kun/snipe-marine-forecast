# Free tier: no persistent disk. Learning in /app/.cache resets on redeploy.
# For durable MOS/nowcast learning, upgrade the service and attach a Disk at /app/.cache.
services:
  - type: web
    name: shichirigahama-forecast
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "3847"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: KEEP_ALIVE_MINUTES
        value: "8"
      - key: ECMWF_CONCURRENCY
        value: "2"
      # RENDER_EXTERNAL_URL is set by Render and enables in-process keep-alive pings.
